name: Snyk

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

jobs:
  snyk:
    name: Snyk Security Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Run Snyk security test
        uses: snyk/actions/node@master
        with:
          command: test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
