version: '3.9'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nestjs_boilerplate
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nestjs_boilerplate']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      PORT: '3000'
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/nestjs_boilerplate
      REDIS_URL: redis://redis:6379
      OBSERVE_APP_KEY: ${OBSERVE_APP_KEY}
      OBSERVE_APP_SECRET: ${OBSERVE_APP_SECRET}
      OIDC_GOOGLE_CLIENT_ID: ${OIDC_GOOGLE_CLIENT_ID}
      OIDC_GOOGLE_CLIENT_SECRET: ${OIDC_GOOGLE_CLIENT_SECRET}
      OIDC_GOOGLE_CALLBACK_URL: ${OIDC_GOOGLE_CALLBACK_URL}
      OIDC_MICROSOFT_CLIENT_ID: ${OIDC_MICROSOFT_CLIENT_ID}
      OIDC_MICROSOFT_CLIENT_SECRET: ${OIDC_MICROSOFT_CLIENT_SECRET}
      OIDC_MICROSOFT_CALLBACK_URL: ${OIDC_MICROSOFT_CALLBACK_URL}
      OIDC_GITHUB_CLIENT_ID: ${OIDC_GITHUB_CLIENT_ID}
      OIDC_GITHUB_CLIENT_SECRET: ${OIDC_GITHUB_CLIENT_SECRET}
      OIDC_GITHUB_CALLBACK_URL: ${OIDC_GITHUB_CALLBACK_URL}
      OIDC_APPLE_CLIENT_ID: ${OIDC_APPLE_CLIENT_ID}
      OIDC_APPLE_CLIENT_SECRET: ${OIDC_APPLE_CLIENT_SECRET}
      OIDC_APPLE_CALLBACK_URL: ${OIDC_APPLE_CALLBACK_URL}
      OIDC_FACEBOOK_CLIENT_ID: ${OIDC_FACEBOOK_CLIENT_ID}
      OIDC_FACEBOOK_CLIENT_SECRET: ${OIDC_FACEBOOK_CLIENT_SECRET}
      OIDC_FACEBOOK_CALLBACK_URL: ${OIDC_FACEBOOK_CALLBACK_URL}
      OIDC_X_CLIENT_ID: ${OIDC_X_CLIENT_ID}
      OIDC_X_CLIENT_SECRET: ${OIDC_X_CLIENT_SECRET}
      OIDC_X_CALLBACK_URL: ${OIDC_X_CALLBACK_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy